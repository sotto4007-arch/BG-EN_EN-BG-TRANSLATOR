<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>BG ↔ EN Translator</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#26364e;--muted:#9aabc2;--text:#f4f7fb;--accent:#6ee7b7;--blue:#7dd3fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b3550 0,#0b1220 58%);font:16px/1.5 system-ui,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
main{width:min(900px,100%)}header{text-align:center;margin-bottom:26px}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}header p{color:var(--muted);margin:0}.tag{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.panel{background:#121d30eF;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 70px #0006}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.langs{display:flex;align-items:center;gap:10px;font-weight:650}.lang{background:#1a2a40;border:1px solid var(--line);padding:9px 14px;border-radius:12px}.swap{border:1px solid var(--line);background:#20334b;color:var(--blue);border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.editors{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor{background:#0c1626;border:1px solid var(--line);border-radius:16px;overflow:hidden}.editor label{display:block;padding:12px 15px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}textarea{display:block;width:100%;min-height:210px;resize:vertical;background:transparent;border:0;outline:0;color:var(--text);padding:16px;font:inherit;font-size:17px}textarea::placeholder{color:#687b95}.bottom{display:flex;justify-content:space-between;align-items:center;padding:0 14px 12px;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#1b2b42;color:var(--text);padding:12px 17px;border-radius:12px;font-weight:650;cursor:pointer}.btn.primary{background:linear-gradient(110deg,#34d399,#38bdf8);border:0;color:#08202a}.btn:disabled{opacity:.55;cursor:wait}.status{min-height:24px;color:var(--muted);font-size:13px;margin-top:12px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:650px){.editors{grid-template-columns:1fr}textarea{min-height:150px}.toolbar{align-items:flex-start}}
</style>
</head>
<body><main>
<header><div class="tag">Simple • Fast • Free</div><h1>বাংলা ↔ English Translator</h1><p>Translate English and Bengali instantly</p></header>
<section class="panel">
<div class="toolbar"><div class="langs"><span class="lang" id="sourceLabel">English</span><button class="swap" id="swap" aria-label="Swap languages">⇄</button><span class="lang" id="targetLabel">বাংলা</span></div><button class="btn" id="clear">Clear</button></div>
<div class="editors">
<div class="editor"><label id="inputTitle">English</label><textarea id="input" placeholder="Type or paste text here..." maxlength="5000"></textarea><div class="bottom"><span>Input</span><span id="count">0 / 5000</span></div></div>
<div class="editor"><label id="outputTitle">বাংলা</label><textarea id="output" placeholder="Translation appears here..." readonly></textarea><div class="bottom"><span>Translation</span><button class="btn" id="copy" style="padding:5px 10px;font-size:12px">Copy</button></div></div>
</div>
<div class="actions"><button class="btn primary" id="translate">Translate</button><button class="btn" id="share">Share on WhatsApp</button></div>
<div class="status" id="status" role="status" aria-live="polite">Ready. Start typing to translate automatically.</div>
</section><div class="foot">Translation powered by Google Translate. Check important translations before use.</div>
</main>
<script>
const $=id=>document.getElementById(id);let reverse=false,timer;
function labels(){ $('sourceLabel').textContent=reverse?'বাংলা':'English';$('targetLabel').textContent=reverse?'English':'বাংলা';$('inputTitle').textContent=reverse?'বাংলা':'English';$('outputTitle').textContent=reverse?'English':'বাংলা';$('input').placeholder=reverse?'এখানে বাংলা লিখুন...':'Type or paste text here...';}
async function translate(){const q=$('input').value.trim();if(!q){$('output').value='';$('status').textContent='Please enter some text.';return} $('translate').disabled=true;$('status').textContent='Translating…';try{const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+(reverse?'bn':'en')+'&tl='+(reverse?'en':'bn')+'&dt=t&q='+encodeURIComponent(q);const r=await fetch(url);if(!r.ok)throw Error('Translation service unavailable');const data=await r.json();$('output').value=(data[0]||[]).map(x=>x[0]||'').join('');$('status').textContent='Translation complete.'}catch(e){$('status').textContent='Could not translate right now. Check your internet connection and try again.'}finally{$('translate').disabled=false}}
$('input').addEventListener('input',()=>{$('count').textContent=$('input').value.length+' / 5000';clearTimeout(timer);timer=setTimeout(translate,650)});
$('translate').addEventListener('click',translate);
$('swap').addEventListener('click',()=>{reverse=!reverse;const a=$('input').value,b=$('output').value;$('input').value=b;$('output').value=a;labels();$('count').textContent=$('input').value.length+' / 5000';$('status').textContent='Languages swapped.'});
$('clear').addEventListener('click',()=>{$('input').value='';$('output').value='';$('count').textContent='0 / 5000';$('status').textContent='Cleared.';$('input').focus()});
$('copy').addEventListener('click',async()=>{if(!$('output').value){$('status').textContent='Nothing to copy yet.';return}try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied to clipboard.'}catch{$('output').select();$('status').textContent='Select and copy the translation.'}});
$('share').addEventListener('click',()=>{const t=$('output').value||$('input').value;if(!t){$('status').textContent='Nothing to share yet.';return}window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')});
labels();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>Glassy Translate | বাংলা ↔ English</title>
<style>
:root{color-scheme:dark;--line:#293750;--muted:#9aa9bf;--white:#f4f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:34px 18px;display:grid;place-items:center;background:radial-gradient(ellipse at 16% 8%,#122a50 0,transparent 42%),radial-gradient(ellipse at 88% 85%,#062d2a 0,transparent 34%),#080e1b;color:var(--white);font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif}
.app{width:min(820px,100%);padding:26px;background:linear-gradient(145deg,#111b2eF5,#0e1829F5);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008}
header{text-align:center;margin:0 0 24px}.logo{width:58px;height:58px;margin:0 auto 12px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#368bff,#20c98a);font-size:30px;box-shadow:0 8px 28px #1689d955}h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:800}h1 span{background:linear-gradient(90deg,#4c9cff,#63c7ff);background-clip:text;color:transparent}.sub{color:var(--muted);font-size:12px;margin-top:7px}
.langbar{display:grid;grid-template-columns:1fr 48px 1fr;gap:10px;align-items:center;margin-bottom:14px}.lang{height:45px;border:1px solid var(--line);background:#1a263b;border-radius:12px;display:grid;place-items:center;font-weight:700}.swap{width:42px;height:42px;border-radius:50%;border:1px solid #344763;background:#1a2b47;color:white;font-size:21px;cursor:pointer}
.editors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{min-width:0;border:1px solid var(--line);border-radius:16px;background:#151f32;overflow:hidden}.panehead{height:42px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.count{font-size:11px;color:var(--muted);font-weight:400}textarea{display:block;width:100%;height:194px;resize:vertical;border:0;outline:0;background:transparent;color:var(--white);font:16px/1.65 "Segoe UI",Arial,sans-serif;padding:14px 15px}textarea::placeholder{color:#7e8ca3}.panefoot{height:42px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.mini{border:1px solid #35445b;background:#202c40;color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:17px}.btn{min-height:45px;border:1px solid var(--line);border-radius:12px;background:#202b3e;color:#fff;font-weight:700;cursor:pointer}.btn.primary{border:0;background:linear-gradient(100deg,#347cff,#5598ff);box-shadow:0 8px 22px #347cff33}.btn.whatsapp{border:0;background:#108c54}.btn:disabled{opacity:.55;cursor:wait}.status{text-align:center;min-height:27px;padding-top:11px;color:#80e5b3;font-size:12px}.status.error{color:#ff9a9a}.settings{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}.toggle{display:flex;align-items:center;gap:9px;cursor:pointer}.toggle input{accent-color:#19a36b;width:17px;height:17px}.rule{height:1px;background:var(--line);margin:17px 0 12px}.foot{text-align:center;color:#8795aa;font-size:10px}.foot div+div{margin-top:8px}
@media(max-width:640px){body{padding:14px 10px}.app{padding:18px 14px;border-radius:18px}h1{font-size:26px}.editors{grid-template-columns:1fr}.pane textarea{height:145px}.actions{grid-template-columns:1fr}.langbar{grid-template-columns:1fr 42px 1fr}}
</style></head><body><main class="app">
<header><div class="logo" aria-hidden="true">文</div><h1>Glassy <span>Translate</span></h1><div class="sub">English ↔ বাংলা | Banglish Translator</div></header>
<div class="langbar"><div class="lang" id="fromLang">বাংলা</div><button class="swap" id="swap" title="Swap languages" aria-label="Swap languages">⇄</button><div class="lang" id="toLang">English</div></div>
<section class="editors">
<div class="pane"><div class="panehead"><span>✍️ Input Text</span><span class="count" id="inCount">0 characters</span></div><textarea id="input" maxlength="5000" placeholder="বাংলা বা Banglish লিখুন..."></textarea><div class="panefoot"><span id="inputHint">বাংলা / Banglish</span><button class="mini" id="clear">Clear</button></div></div>
<div class="pane"><div class="panehead"><span>▦ Translation</span><span class="count" id="outCount">0 characters</span></div><textarea id="output" readonly placeholder="Translation will appear here..."></textarea><div class="panefoot"><span id="outputHint">English</span><button class="mini" id="copy">▣ Copy</button></div></div>
</section><div class="actions"><button class="btn primary" id="translate">🌐 Translate</button><button class="btn whatsapp" id="whatsapp">🟢 WhatsApp</button><button class="btn" id="reset">↻ Reset</button></div>
<div class="status" id="status" role="status" aria-live="polite">Ready — type text to translate.</div><div class="settings"><label class="toggle"><input type="checkbox" id="live" checked><span>Live Translation</span></label><span>Auto translate after 1 second</span></div><div class="rule"></div><footer class="foot"><div>Powered by Google Translate and Google Input Tools</div><div>© 2026 Glassy Translate</div></footer>
</main><script>
(()=>{const $=id=>document.getElementById(id);let reverse=false,timer=null,requestNo=0;
const hasBangla=s=>/[\u0980-\u09FF]/.test(s);const setStatus=(msg,error=false)=>{$('status').textContent=msg;$('status').classList.toggle('error',error)};
function labels(){$('fromLang').textContent=reverse?'English':'বাংলা';$('toLang').textContent=reverse?'বাংলা':'English';$('inputHint').textContent=reverse?'English':'বাংলা / Banglish';$('outputHint').textContent=reverse?'বাংলা':'English';$('input').placeholder=reverse?'Type English text here...':'বাংলা বা Banglish লিখুন...'}
function counts(){$('inCount').textContent=$('input').value.length+' characters';$('outCount').textContent=$('output').value.length+' characters'}
async function banglishToBangla(text){if(hasBangla(text))return text;const url='https://inputtools.google.com/request?text='+encodeURIComponent(text)+'&itc=bn-t-i0-und&num=5&cp=0&cs=1&ie=utf-8&oe=utf-8';const r=await fetch(url);if(!r.ok)throw Error('Banglish conversion service is unavailable');const d=await r.json();if(d[0]!=='SUCCESS'||!d[1]?.[0]?.[1]?.length)throw Error('Could not recognize this Banglish text');return d[1][0][1][0]}
async function googleTranslate(text,source,target){const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+source+'&tl='+target+'&dt=t&q='+encodeURIComponent(text);const r=await fetch(url);if(!r.ok)throw Error('Translation service is unavailable');const d=await r.json();return(d[0]||[]).map(x=>x[0]||'').join('')}
async function translate(){const raw=$('input').value.trim();if(!raw){$('output').value='';counts();setStatus('Please enter some text first.',true);return}const n=++requestNo;$('translate').disabled=true;setStatus('Translating…');try{let result;if(reverse)result=await googleTranslate(raw,'en','bn');else{const bn=hasBangla(raw)?raw:await banglishToBangla(raw);if(n!==requestNo)return;result=await googleTranslate(bn,'bn','en')}if(n!==requestNo)return;$('output').value=result;counts();setStatus('✓ Translation completed successfully.')}catch(e){if(n!==requestNo)return;setStatus(e.message+'. Check your internet connection and try again.',true)}finally{if(n===requestNo)$('translate').disabled=false}}
$('input').addEventListener('input',()=>{counts();if($('live').checked){clearTimeout(timer);timer=setTimeout(translate,1000)}});$('translate').addEventListener('click',translate);
$('swap').addEventListener('click',()=>{reverse=!reverse;const old=$('input').value;$('input').value=$('output').value;$('output').value=old;labels();counts();setStatus('Languages swapped.')});
$('clear').addEventListener('click',()=>{$('input').value='';$('output').value='';counts();setStatus('Input cleared.');$('input').focus()});
$('reset').addEventListener('click',()=>{reverse=false;$('input').value='';$('output').value='';labels();counts();setStatus('Translator reset.')});
$('copy').addEventListener('click',async()=>{const v=$('output').value;if(!v){setStatus('Nothing to copy yet.',true);return}try{await navigator.clipboard.writeText(v);setStatus('✓ Translation copied.')}catch{$('output').focus();$('output').select();setStatus('Select the text and copy it with Ctrl+C.')}});
$('whatsapp').addEventListener('click',()=>{const v=$('output').value||$('input').value;if(!v){setStatus('Nothing to share yet.',true);return}window.open('https://wa.me/?text='+encodeURIComponent(v),'_blank','noopener,noreferrer')});
$('live').addEventListener('change',()=>{if($('live').checked&&$('input').value.trim()){clearTimeout(timer);timer=setTimeout(translate,300)}else{clearTimeout(timer);setStatus('Live translation paused.')}});labels();counts()})();
</script></body></html>
